[project]
name = "Oxidoc"
description = "A documentation engine written in Rust. Zero Node.js. Interactive Wasm islands."
logo = "/assets/logo.svg"
base_url = "https://oxidoc.dev"
edit_url = "https://github.com/oxidoc-lab/oxidoc-docs/blob/main/docs"

[theme]
primary = "#3b82f6"
dark_mode = "system"

[routing.root]
homepage = "home.rdx"

[routing]
header_links = [
  { label = "Docs", href = "/docs" },
  { label = "Lib", href = "/lib" },
  { label = "API", href = "/api" },
]
navigation = [
  { path = "/docs", dir = "docs", groups = [
    { group = "Getting Started", pages = [
      "installation",
      "quickstart",
      "writing-content",
    ] },
    { group = "Core", pages = [
      "configuration",
      "cli",
      "components",
      "components/landing-page",
    ] },
    { group = "Search", pages = [
      "search",
      "search/lexical",
      "search/semantic",
      "search/providers",
    ] },
    { group = "Features", pages = [
      "versioning",
      "i18n",
      "seo",
      "analytics",
      "theming",
      "api-reference",
    ] },
    { group = "Advanced", pages = [
      "guides/animations",
      "guides/custom-components",
      "guides/troubleshooting",
    ] },
    { group = "AI", pages = [
      "ai/llms-txt",
      "ai/custom-models",
      "ai/embedding-export",
      "ai/agent-skills",
    ] },
    { group = "Deployment", pages = [
      "deployment",
      "deployment/github-pages",
      "deployment/vercel",
      "deployment/netlify",
    ] },
  ] },
  { path = "/lib", dir = "lib", groups = [
    { group = "Library API", pages = [
      "index",
      "manual-api",
      "library-example",
    ] },
  ] },
  { path = "/api", openapi = "./openapi.yaml" },
]

[search]
# semantic = true

[social]
github = "https://github.com/oxidoc-lab/oxidoc"
discord = "https://discord.gg/CGHU4TR7Zb"

[footer]
copyright_owner = "Oxidoc"
